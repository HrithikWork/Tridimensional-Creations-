<svg viewBox="0 0 800 1200" width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="walnutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C24"/>
      <stop offset="50%" stop-color="#1C2733"/>
      <stop offset="100%" stop-color="#0E161F"/>
    </linearGradient>
    <linearGradient id="chiselGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC491"/>
      <stop offset="50%" stop-color="#C5A869"/>
      <stop offset="100%" stop-color="#9E8142"/>
    </linearGradient>
    <linearGradient id="chiselShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090E14" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090E14" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="chiselBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#05080C" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Solid Substrate Slab (Dark Walnut / Smoked Oak) -->
  <rect width="800" height="1200" fill="url(#walnutGrad)"/>
  
  <!-- Outer Chamfer Border -->
  <rect x="40" y="40" width="720" height="1120" fill="none" stroke="#2D3B4A" stroke-width="2" rx="4"/>
  <rect x="52" y="52" width="696" height="1096" fill="none" stroke="url(#chiselGold)" stroke-width="1.5" stroke-dasharray="8 4" rx="2" opacity="0.6"/>

  <!-- V-Bit Toolpath Precision Center Lines -->
  <g stroke="#263442" stroke-width="1" opacity="0.5">
    <line x1="400" y1="80" x2="400" y2="1120"/>
    <line x1="80" y1="600" x2="720" y2="600"/>
    <circle cx="400" cy="380" r="180" fill="none"/>
    <circle cx="400" cy="380" r="220" fill="none" stroke-dasharray="4 6"/>
  </g>

  <!-- Architectural Heraldic Monogram / Crest (V-Carved 90-degree bevel) -->
  <g filter="url(#chiselBevel)">
    <!-- Outer Crest Shield -->
    <path d="M400 200 C480 200 550 220 560 300 C560 430 460 510 400 540 C340 510 240 430 240 300 C250 220 320 200 400 200 Z" fill="none" stroke="url(#chiselGold)" stroke-width="4"/>
    <path d="M400 215 C470 215 535 235 545 305 C545 420 450 495 400 522 C350 495 255 420 255 305 C265 235 330 215 400 215 Z" fill="#141C24" stroke="#2D3B4A" stroke-width="1"/>

    <!-- Central Geometric Monogram 'T & C' V-Carve Geometry -->
    <!-- Chiseled Prism facets -->
    <polygon points="400,250 360,320 400,310" fill="url(#chiselGold)"/>
    <polygon points="400,250 440,320 400,310" fill="#9E8142"/>
    
    <polygon points="360,320 400,310 400,450 380,450" fill="url(#chiselGold)"/>
    <polygon points="440,320 400,310 400,450 420,450" fill="#846B34"/>
    
    <polygon points="320,320 400,310 400,335 320,340" fill="url(#chiselGold)"/>
    <polygon points="480,320 400,310 400,335 480,340" fill="#755E2C"/>

    <!-- Botanical Laurel Sprigs flanking crest -->
    <g stroke="url(#chiselGold)" stroke-width="2" fill="none" opacity="0.85">
      <path d="M210 400 C210 320 250 250 310 210"/>
      <path d="M590 400 C590 320 550 250 490 210"/>
    </g>
  </g>

  <!-- Crisp V-Carved Typography -->
  <!-- Primary Brand Title -->
  <text x="400" y="660" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">
    TRIDIMENSIONAL
  </text>
  <text x="400" y="705" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" letter-spacing="3" fill="url(#chiselGold)" text-anchor="middle">
    Architectural Signage Atelier
  </text>

  <!-- Divider Rule with V-Groove diamond -->
  <g stroke="url(#chiselGold)" stroke-width="1.5">
    <line x1="200" y1="745" x2="370" y2="745"/>
    <polygon points="400,738 408,745 400,752 392,745" fill="url(#chiselGold)"/>
    <line x1="430" y1="745" x2="600" y2="745"/>
  </g>

  <!-- Technical Depth & Bit Spec Indicator -->
  <text x="400" y="805" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#CADBE8" text-anchor="middle">
    90° & 60° CHISEL ROUTING • 12MM RELIEF
  </text>
  <text x="400" y="845" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#8FA4B8" text-anchor="middle">
    CORPORATE RECEPTION & WAYFINDING PLAQUES
  </text>

  <!-- Machined Corner Brackets -->
  <g stroke="url(#chiselGold)" stroke-width="2" fill="none">
    <path d="M 70 100 L 70 70 L 100 70"/>
    <path d="M 730 100 L 730 70 L 700 70"/>
    <path d="M 70 1100 L 70 1130 L 100 1130"/>
    <path d="M 730 1100 L 730 1130 L 700 1130"/>
  </g>

  <!-- Bottom Coordinates Tag -->
  <rect x="250" y="1030" width="300" height="36" fill="#141C24" stroke="#2D3B4A" rx="3"/>
  <text x="400" y="1053" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#DFC491" text-anchor="middle">
    GUWAHATI • PRECISION V-CARVE
  </text>
</svg>
