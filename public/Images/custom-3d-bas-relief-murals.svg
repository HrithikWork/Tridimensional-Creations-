<svg viewBox="0 0 800 1200" width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warmStoneRelief" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE6DE"/>
      <stop offset="50%" stop-color="#DFD8CC"/>
      <stop offset="100%" stop-color="#CCC2B2"/>
    </linearGradient>
    <radialGradient id="highlightSpot" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#DFD8CC" stop-opacity="0"/>
    </radialGradient>
    <filter id="reliefDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="4" dy="8" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Substrate (Teak / HDHMR Slab) -->
  <rect width="800" height="1200" fill="url(#warmStoneRelief)"/>
  <rect width="800" height="1200" fill="url(#highlightSpot)"/>

  <!-- Architectural Boundary & Ball-Nose Toolpaths -->
  <rect x="45" y="45" width="710" height="1110" fill="none" stroke="#B8AD9C" stroke-width="2" rx="4"/>
  <rect x="58" y="58" width="684" height="1084" fill="none" stroke="#A69985" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Sculpted 3D Bas-Relief Contours (Religious & Botanical Waves) -->
  <g filter="url(#reliefDepth)">
    <!-- Mandir Arch Outer Bevel -->
    <path d="M160 850 L160 480 C160 260 260 160 400 160 C540 160 640 260 640 480 L640 850 Z" 
          fill="#D9D0C3" stroke="#8E806D" stroke-width="3"/>
    
    <path d="M190 850 L190 490 C190 300 280 200 400 200 C520 200 610 300 610 490 L610 850 Z" 
          fill="#E5DDD0" stroke="#A89B88" stroke-width="2"/>

    <!-- Radiant Lotus / Sunburst Relief Petals -->
    <g fill="#F2ECE1" stroke="#9E8F7A" stroke-width="2">
      <!-- Central medallion -->
      <circle cx="400" cy="460" r="85" fill="#DDD4C5" stroke="#7A6D5B" stroke-width="3"/>
      <circle cx="400" cy="460" r="60" fill="#EBE3D5" stroke="#8E806D" stroke-width="2"/>
      <circle cx="400" cy="460" r="30" fill="#FAF6ED" stroke="#5C5040" stroke-width="2.5"/>

      <!-- 12 Radiating Chiseled Petals -->
      <path d="M400 375 C415 320 440 270 400 230 C360 270 385 320 400 375 Z"/>
      <path d="M400 545 C415 600 440 650 400 690 C360 650 385 600 400 545 Z"/>
      <path d="M315 460 C260 475 210 500 170 460 C210 420 260 445 315 460 Z"/>
      <path d="M485 460 C540 475 590 500 630 460 C590 420 540 445 485 460 Z"/>

      <!-- Diagonal Petals -->
      <path d="M340 400 C290 350 250 320 237 297 C270 310 310 350 340 400 Z"/>
      <path d="M460 400 C510 350 550 320 563 297 C530 310 490 350 460 400 Z"/>
      <path d="M340 520 C290 570 250 600 237 623 C270 610 310 570 340 520 Z"/>
      <path d="M460 520 C510 570 550 600 563 623 C530 610 490 570 460 520 Z"/>
    </g>

    <!-- Flowing Undulating Base Dunes (Relief depth 40mm) -->
    <path d="M190 730 Q290 690, 400 740 T610 710 L610 850 L190 850 Z" fill="#D3C9BA" stroke="#8E806D" stroke-width="2"/>
    <path d="M190 780 Q310 740, 400 790 T610 760 L610 850 L190 850 Z" fill="#C5B9A8" stroke="#7A6D5B" stroke-width="2.5"/>
  </g>

  <!-- Typography & Machine Ball-Nose Notation -->
  <text x="400" y="930" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="2" fill="#0A1931" text-anchor="middle">
    BAS-RELIEF SCULPTURAL MURALS
  </text>
  <text x="400" y="970" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#4A7FA7" text-anchor="middle">
    MULTI-PASS 3D CNC BALL-NOSE MILLING
  </text>
  <text x="400" y="1005" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#5A6C7D" text-anchor="middle">
    DEPTH UP TO 40MM • MANDIR & ACCENT WALLS
  </text>

  <!-- Technical Depth Indicator -->
  <g stroke="#8E806D" stroke-width="1.2">
    <line x1="120" y1="1080" x2="680" y2="1080"/>
    <polyline points="130,1075 120,1080 130,1085"/>
    <polyline points="670,1075 680,1080 670,1085"/>
    <text x="400" y="1075" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#0A1931" text-anchor="middle">
      Z-AXIS STEP-OVER: 0.25MM SCALLOP HEIGHT
    </text>
  </g>
</svg>
