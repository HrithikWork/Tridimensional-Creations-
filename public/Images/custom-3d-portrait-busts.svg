<svg viewBox="0 0 800 1200" width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="studioPortraitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222B36"/>
      <stop offset="50%" stop-color="#18202A"/>
      <stop offset="100%" stop-color="#0E141D"/>
    </linearGradient>
    <linearGradient id="marbleStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#EDE8E1"/>
      <stop offset="70%" stop-color="#D3CBC0"/>
      <stop offset="100%" stop-color="#B8AE9F"/>
    </linearGradient>
    <filter id="bustElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="5" flood-color="#05080C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Studio Dark Charcoal Background -->
  <rect width="800" height="1200" fill="url(#studioPortraitBg)"/>

  <!-- Architectural Frame & Photogrammetry Mesh Axis -->
  <rect x="45" y="45" width="710" height="1110" fill="none" stroke="#2D3B4A" stroke-width="1.5" rx="4"/>
  <rect x="58" y="58" width="684" height="1084" fill="none" stroke="#7E9AB3" stroke-width="1" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Photogrammetry 3D Scan Wireframe Mesh Nodes -->
  <g stroke="#4A7FA7" stroke-width="0.8" opacity="0.4" fill="none">
    <circle cx="400" cy="380" r="140"/>
    <circle cx="400" cy="380" r="180"/>
    <line x1="400" y1="120" x2="400" y2="700"/>
    <line x1="200" y1="380" x2="600" y2="380"/>
    <line x1="260" y1="240" x2="540" y2="520"/>
    <line x1="540" y1="240" x2="260" y2="520"/>
  </g>

  <!-- Classical 3D Memorial Portrait Bust Silhouette -->
  <g filter="url(#bustElevation)">
    <!-- Head & Facial Profile Contours (Classical Greek / Memorial Proportions) -->
    <!-- Cranium & Sculpted Hair -->
    <path d="M 330 220 C 330 150, 470 150, 470 220 C 490 240, 480 300, 480 330 C 480 370, 450 440, 400 460 C 350 440, 320 370, 320 330 C 320 300, 310 240, 330 220 Z" 
          fill="url(#marbleStone)" stroke="#7A6F62" stroke-width="2"/>

    <!-- Chiseled Facial Planes (Forehead, Brow, Nose, Cheekbone, Jaw) -->
    <polygon points="400,260 380,310 420,310" fill="#E2DDD5"/>
    <!-- Nose Ridge -->
    <polygon points="400,290 395,360 405,360" fill="#F7F5F2"/>
    <polygon points="395,360 400,375 405,360" fill="#C5BCAD"/>
    <!-- Cheekbones -->
    <polygon points="360,330 385,340 375,370" fill="#D8D1C5"/>
    <polygon points="440,330 415,340 425,370" fill="#EFECE6"/>
    <!-- Strong Jawline & Chin -->
    <polygon points="370,410 400,445 430,410" fill="#C9BFB0"/>
    
    <!-- Neck Column -->
    <path d="M 370 435 L 360 530 L 440 530 L 430 435 Z" fill="url(#marbleStone)" stroke="#8C8173" stroke-width="1.5"/>

    <!-- Classical Sculpted Shoulders / Draped Roman Toga Chest -->
    <path d="M 230 650 C 250 540, 340 520, 400 520 C 460 520, 550 540, 570 650 L 570 690 C 490 730, 310 730, 230 690 Z" 
          fill="url(#marbleStone)" stroke="#7A6F62" stroke-width="2"/>
    
    <!-- Drapery Fold Shadows -->
    <path d="M 310 560 Q 400 660, 490 560" fill="none" stroke="#7A6F62" stroke-width="3"/>
    <path d="M 280 610 Q 400 700, 520 610" fill="none" stroke="#8C8173" stroke-width="2.5"/>

    <!-- Classical Turned Wooden / Cast Pedestal Base -->
    <rect x="360" y="700" width="80" height="40" rx="3" fill="#D3CBC0" stroke="#7A6F62" stroke-width="2"/>
    <rect x="320" y="740" width="160" height="25" rx="3" fill="#B8AE9F" stroke="#7A6F62" stroke-width="2"/>
    <rect x="290" y="765" width="220" height="35" rx="4" fill="#3D3327" stroke="#9E8D79" stroke-width="2"/>
  </g>

  <!-- Typography & 3D Scanning Spec -->
  <text x="400" y="910" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    3D PORTRAIT BUSTS & MEMORIALS
  </text>
  <text x="400" y="950" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#E5C384" text-anchor="middle">
    PHOTOGRAMMETRY SCULPTING FROM 2D PHOTOS
  </text>
  <text x="400" y="985" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="2" fill="#95A6B8" text-anchor="middle">
    CLASSICAL MARBLE WHITE • BRONZE CASTING EFFECT
  </text>

  <!-- Studio Customization Tag -->
  <rect x="220" y="1040" width="360" height="34" fill="#141C24" stroke="#7E9AB3" rx="3"/>
  <text x="400" y="1062" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#E2DDD5" text-anchor="middle">
    ANCESTRAL & EXECUTIVE COMMEMORATIVE BUSTS
  </text>
</svg>
